[project]
name = "centralized-jobs-monitoring"
version = "1.0.0"
description = "Real-time Databricks Jobs monitoring and anomaly detection"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "databricks-sdk>=0.30.0",
    "pydantic>=2.0.0",
    "asyncpg>=0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
